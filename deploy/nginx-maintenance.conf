# Miles Capital – show the maintenance page when a portal app (PM2 process) is down.
#
# Paste these lines inside the `server { ... }` block of each WEB portal:
#   broker.milescapitals.com        (miles-web,       port 3000)
#   broker-admin.milescapitals.com  (miles-admin-web, port 3002)
# Do NOT add them to the api-* server blocks: the API answers in JSON (the Cloudflare
# Worker handles API outages).
#
# One-time file copy on the server:
#   sudo mkdir -p /var/www/maintenance
#   sudo cp <frontend checkout>/deploy/maintenance.html /var/www/maintenance/maintenance.html
#
# When the app is down nginx itself produces 502 (connection refused) or 504 (timeout);
# those are swapped for the maintenance page with status 503 + Retry-After.

error_page 502 504 =503 /__maintenance.html;

location = /__maintenance.html {
    internal;
    alias /var/www/maintenance/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
}
